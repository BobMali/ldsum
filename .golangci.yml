# The default linters (staticcheck, errcheck, ineffassign, unused) alongside the
# vet already in the definition of done, plus two additions and one exclusion.
version: "2"

linters:
  enable:
    # fmt.Errorf with no verbs, and fmt where strconv would do.
    - perfsprint
    # Doc comments on exported identifiers, among other style rules.
    - revive

  exclusions:
    rules:
      # golangci-lint v1 shipped these exclusions by default; v2 dropped them.
      # Ignoring the byte count when writing to a handed-in io.Writer, and the
      # close error on a file opened for reading, is ordinary Go — annotating
      # every call with `_ =` would add noise without adding a check.
      #
      # A pipeline whose reader goes away is already handled: the runtime raises
      # SIGPIPE on stdout and ldsum dies with 141. What stays unnoticed is a
      # closed descriptor or a full disk, which is a design question rather than
      # a lint one, and is recorded as a known limit.
      - linters:
          - errcheck
        source: '^\s*(defer .*\.Close\(\)|fmt\.Fprint(f|ln)?\()'
