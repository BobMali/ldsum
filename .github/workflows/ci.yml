name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: definition of done
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the version from go.mod, so this stays in step with the module.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The three gates run as separate steps so a red build names the one
      # that broke, rather than collapsing into a single opaque failure.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
