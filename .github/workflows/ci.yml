name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: definition of done
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the version from go.mod, so this stays in step with the module.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The three gates run as separate steps so a red build names the one
      # that broke, rather than collapsing into a single opaque failure.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # No .golangci.yml, so this is the default set: staticcheck, errcheck,
      # ineffassign and unused, on top of the vet already run above.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  commits:
    name: commit messages
    runs-on: ubuntu-latest

    steps:
      # Subjects are only readable with history; the default checkout has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs githooks/commit-msg, the same script a clone runs locally, so the
      # pattern in githooks/conventional-regex.txt stays the single source of
      # truth. Only the new commits are checked: history predates the hook and
      # the initial commit does not match.
      #
      # Not covered: a squash merge composed from the pull request title, which
      # never appears as a commit in this range.
      - name: check subjects
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          if [ -n "${PR_BASE:-}" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] &&
               [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..HEAD"
          else
            # A new branch or a force push leaves no usable base. Check the tip
            # rather than every commit that came before the hook existed.
            range="HEAD~1..HEAD"
          fi

          # Resolve the range explicitly. Left inline, a failing rev-list prints
          # nothing, the loop runs zero times and the job passes — a gate that
          # cannot fail is worse than no gate.
          if ! shas=$(git rev-list "$range" 2>&1); then
            echo "cannot resolve $range:"
            echo "$shas"
            exit 1
          fi

          count=$(printf '%s\n' "$shas" | grep -c . || true)
          echo "checking $count commit(s) in $range"

          failed=0
          for sha in $shas; do
            git log -1 --format=%s "$sha" > "$RUNNER_TEMP/subject"
            if ! bash githooks/commit-msg "$RUNNER_TEMP/subject"; then
              echo "  ^ $sha"
              failed=1
            fi
          done
          exit "$failed"
